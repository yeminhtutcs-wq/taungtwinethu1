<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>တောင်တွင်းသူ - အိမ်ချက်လက်ရာ အစားအစာများ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Download Slip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #f7fee7;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-yellow-400 text-emerald-900 rounded-full w-10 h-10 flex items-center justify-center font-bold text-xl shadow">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">တောင်တွင်းသူ</h1>
                    <p class="text-xs text-emerald-200">အိမ်ချက်လက်ရာ အစားအစာများ</p>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-xl flex items-center space-x-2 transition shadow">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hidden sm:inline">ခြင်းတောင်း</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold shadow">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Menu Section -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="search-input" oninput="filterMenu()" placeholder="ဟင်းမည် ရှာရန်..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <!-- Categories -->
                <div id="category-tabs" class="flex overflow-x-auto space-x-2 pb-2 scrollbar-none">
                    <button onclick="setCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-emerald-800 text-white transition">အားလုံး</button>
                    <button onclick="setCategory('pork')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">ဝက်သား</button>
                    <button onclick="setCategory('beef')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">အမဲသား</button>
                    <button onclick="setCategory('chicken')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">ကြက်သား</button>
                    <button onclick="setCategory('mutton')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">ဆိတ်သား</button>
                    <button onclick="setCategory('fish')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">ငါး / ငါးခြောက်</button>
                    <button onclick="setCategory('seasonal')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-emerald-100 transition">ရာသီစာ & အခြား</button>
                </div>
            </div>

            <!-- Menu Grid -->
            <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>

        <!-- Cart Sidebar -->
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 sticky top-20">
                <h2 class="text-lg font-bold text-emerald-900 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt mr-2"></i>မှာယူမည့် စာရင်း</span>
                    <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">အားလုံးဖျက်ရန်</button>
                </h2>

                <div id="cart-items" class="divide-y divide-gray-100 max-h-64 overflow-y-auto mb-4">
                    <p class="text-gray-400 text-sm text-center py-6">ခြင်းတောင်းထဲတွင် ဟင်းပစ္စည်းများ မရှိသေးပါ။</p>
                </div>

                <!-- Delivery Fee Only -->
                <div class="space-y-3 pt-3 border-t border-gray-100">
                    <div>
                        <label class="text-xs font-semibold text-gray-600 block mb-1">ပို့ခ (Delivery Fee) ကျပ်</label>
                        <input type="number" id="delivery-fee" value="0" oninput="updateTotals()" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>

                <!-- Calculation Summary -->
                <div class="mt-4 pt-4 border-t border-dashed border-gray-200 space-y-2 text-sm">
                    <div class="flex justify-between text-gray-600">
                        <span>ဟင်းဖိုးစုစုပေါင်း:</span>
                        <span id="subtotal-price">0 ကျပ်</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>ပို့ခ:</span>
                        <span id="delivery-display">0 ကျပ်</span>
                    </div>
                    <div class="flex justify-between font-bold text-base text-emerald-900 pt-2 border-t border-gray-100">
                        <span>စုစုပေါင်းကျသင့်ငွေ:</span>
                        <span id="grand-total">0 ကျပ်</span>
                    </div>
                </div>

                <button onclick="generateSlipModal()" class="w-full mt-5 bg-emerald-800 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-file-invoice"></i>
                    <span>အော်ဒါစလစ် ထုတ်မည်</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Slip Preview Modal -->
    <div id="slip-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center
